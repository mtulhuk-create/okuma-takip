# Okuma hatirlatmalari, geri sayim bildirimleri, ceza hesaplama ve vade kontrolu.
# Vercel Hobby planinda cron gunde bir kez calistigi icin 5 dakikada bir buradan tetiklenir.
name: cron
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call cron endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: curl -fsS --max-time 90 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron"
